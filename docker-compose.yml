services:
  volume-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - carpenter-data:/data
    restart: "no"

  carpenter:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-carpenter:local
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CARPENTER_APP_NAME: The Carpenter
      CARPENTER_ENV: ${CARPENTER_ENV:-development}
      CARPENTER_DB_PATH: /data/carpenter.db
      CARPENTER_ADMIN_TOKEN: ${CARPENTER_ADMIN_TOKEN:?Set CARPENTER_ADMIN_TOKEN in .env}
      CARPENTER_AGENT_ENROLLMENT_TOKEN: ${CARPENTER_AGENT_ENROLLMENT_TOKEN:?Set CARPENTER_AGENT_ENROLLMENT_TOKEN in .env}
      CARPENTER_AGENT_STALE_SECONDS: ${CARPENTER_AGENT_STALE_SECONDS:-90}
      CARPENTER_WORKER_LEASE_SECONDS: ${CARPENTER_WORKER_LEASE_SECONDS:-600}
      CARPENTER_COOKIE_SECURE: ${CARPENTER_COOKIE_SECURE:-false}
      CARPENTER_LLM_PROVIDER: ${CARPENTER_LLM_PROVIDER:-none}
      CARPENTER_LLM_MODEL: ${CARPENTER_LLM_MODEL:-llama3.1:8b}
      CARPENTER_LLM_BASE_URL: ${CARPENTER_LLM_BASE_URL:-http://host.docker.internal:11434}
      CARPENTER_LLM_API_KEY: ${CARPENTER_LLM_API_KEY:-}
      CARPENTER_LLM_TIMEOUT_SECONDS: ${CARPENTER_LLM_TIMEOUT_SECONDS:-20}
    ports:
      - "${CARPENTER_PORT:-8000}:8000"
    volumes:
      - carpenter-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  carpenter-data:
