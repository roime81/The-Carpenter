name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q backend node_agent tests
      - name: Import control plane and worker modules
        env:
          PYTHONPATH: backend:node_agent
          CARPENTER_AGENT_ENROLLMENT_TOKEN: ci-agent-token
        run: python -c "import app.main; import app.deployment_engine; import agent; import handlers"
      - name: Run unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
